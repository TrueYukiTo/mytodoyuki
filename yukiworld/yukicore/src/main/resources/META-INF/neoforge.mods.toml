modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/TrueYukiTo/mytodoyuki/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "yukicore_logo.png"
description = '''
Фирменный мод сборки YukiWorld ❄
Ледяные руды и кристаллы Юки, морозные инструменты и броня, Звезда Юки,
собственное главное меню, компактный HUD и Smart FPS (экономия ресурсов в фоне).
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

# YukiCore перекрывает часть рецептов этого мода (крафты в стиле ATM) — грузимся после него
